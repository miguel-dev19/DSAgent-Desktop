name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew createDistributable
      
    - name: Get version
      id: version
      run: |
        $count = (git rev-list --count HEAD)
        echo "VERSION=v1.4.$count" >> $env:GITHUB_OUTPUT
      
    - name: Rename MSI
      run: |
        $msi = Get-ChildItem -Path build -Recurse -Filter *.msi | Select-Object -First 1
        Copy-Item $msi.FullName "DSAgent-Desktop-${{ steps.version.outputs.VERSION }}.msi"
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: DSAgent Desktop ${{ steps.version.outputs.VERSION }}
        body: |
          ## DSAgent Desktop para Windows
          
          **Version:** ${{ steps.version.outputs.VERSION }}
          
          ### Instalacion
          1. Descargar el archivo .msi
          2. Ejecutar instalador
          3. Abrir DSAgent desde Menu Inicio
        files: DSAgent-Desktop-${{ steps.version.outputs.VERSION }}.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
