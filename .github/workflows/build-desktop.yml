name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew createDistributable
      
    - name: Find MSI file
      run: |
        echo "=== Buscando todos los archivos en build ==="
        Get-ChildItem -Path build -Recurse -Depth 5 | Where-Object { $_.Name -like "*.msi" -or $_.Name -like "*.exe" }
        echo "=== Listando estructura ==="
        Get-ChildItem -Path build -Recurse -Depth 4
        
    - name: Get version
      id: version
      run: |
        $count = (git rev-list --count HEAD)
        echo "VERSION=v1.4.$count" >> $env:GITHUB_OUTPUT
      
    - name: Upload MSI as artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Installer
        path: build/**/*.msi
