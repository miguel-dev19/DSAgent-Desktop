name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew createDistributable
      
    - name: Buscar archivos generados
      run: |
        echo "=== Buscando .msi ==="
        Get-ChildItem -Path build -Recurse -Filter *.msi -ErrorAction SilentlyContinue
        echo "=== Buscando .exe ==="
        Get-ChildItem -Path build -Recurse -Filter *.exe -ErrorAction SilentlyContinue
        echo "=== Estructura build ==="
        Get-ChildItem -Path build -Recurse -Depth 4 -ErrorAction SilentlyContinue
      
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Windows
        path: build/compose/binaries/**/*
