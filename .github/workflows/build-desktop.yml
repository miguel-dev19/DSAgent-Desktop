name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew :desktop:createDistributable
      
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Windows
        path: desktop/build/compose/binaries/main/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Linux DEB
      run: chmod +x gradlew && ./gradlew :desktop:createDistributable
      
    - name: Upload Linux Installer
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Linux
        path: desktop/build/compose/binaries/main/deb/*.deb

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build macOS DMG
      run: ./gradlew :desktop:createDistributable
      
    - name: Upload macOS Installer
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-macOS
        path: desktop/build/compose/binaries/main/dmg/*.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: desktop-${{ github.run_number }}
        name: DSAgent Desktop v1.4.${{ github.run_number }}
        body: |
          ## DSAgent Desktop
          
          **Build:** ${{ github.run_number }}
          **Fecha:** $(date +'%Y-%m-%d')
          
          ### Instaladores disponibles:
          - Windows (.msi)
          - Linux (.deb)
          - macOS (.dmg)
        files: |
          DSAgent-Windows/*.msi
          DSAgent-Linux/*.deb
          DSAgent-macOS/*.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
