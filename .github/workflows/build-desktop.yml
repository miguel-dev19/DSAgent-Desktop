name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew :desktop:createDistributable
      
    - name: Listar archivos generados
      run: dir desktop\build\compose\binaries\main\msi /s
      
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Windows
        path: |
          desktop/build/compose/binaries/**/*.msi
          desktop/build/compose/binaries/**/*.exe
