name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew createDistributable --info
      
    - name: Mostrar TODO el contenido de build
      run: |
        echo "=== Listando build completo ==="
        Get-ChildItem -Path build -Recurse -Depth 6
        echo "=== Buscando exe ==="
        Get-ChildItem -Path . -Recurse -Filter *.exe -ErrorAction SilentlyContinue
        echo "=== Buscando msi ==="
        Get-ChildItem -Path . -Recurse -Filter *.msi -ErrorAction SilentlyContinue
      
    - name: Upload everything
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Build-Output
        path: build/**
