name: Build DSAgent Desktop

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Build Windows MSI
      run: ./gradlew :desktop:createDistributable
      
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: DSAgent-Windows
        path: desktop/build/compose/binaries/main/msi/*.msi
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.4.${{ github.run_number }}
        name: DSAgent Desktop v1.4.${{ github.run_number }}
        body: |
          ## DSAgent Desktop para Windows
          
          **Build:** ${{ github.run_number }}
          
          ### Instalacion
          1. Descargar **DSAgent-Windows.msi**
          2. Ejecutar instalador
          3. Abrir DSAgent desde el menu inicio
        files: desktop/build/compose/binaries/main/msi/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
